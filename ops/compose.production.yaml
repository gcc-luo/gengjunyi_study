name: family-learning

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: family_learning_api
  MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-family-learning-videos}
  MINIO_PUBLIC_URL: https://${S3_DOMAIN:?set S3_DOMAIN}
  APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
  AUTH_BYPASS: ${AUTH_BYPASS:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.42.2}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}

services:
  preflight:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "/ops/check-production-env.sh"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      S3_DOMAIN: ${S3_DOMAIN:?set S3_DOMAIN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    volumes:
      - ./check-production-env.sh:/ops/check-production-env.sh:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN:?set S3_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      public:
        ipv4_address: 172.30.42.2
      storage: {}
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web-runtime
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - public
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - public
      - database
      - storage
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
    command: ["node", "server/dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    volumes:
      - transcode_temp:/tmp
    networks:
      - database
      - storage
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    environment:
      <<: *app-environment
    command: ["sh", "-c", "npm run db:migrate:deploy && npm run db:seed && npm run storage:init"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - database
      - storage

  admin:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    profiles: ["admin"]
    environment:
      <<: *app-environment
    command: ["npm", "run", "admin:create"]
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      preflight:
        condition: service_completed_successfully
    networks:
      - database

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      MINIO_API_STALE_UPLOADS_EXPIRY: 168h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      preflight:
        condition: service_completed_successfully
    networks:
      - storage

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "/ops/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-family-learning-videos}
    volumes:
      - ./init-minio.sh:/ops/init-minio.sh:ro
      - minio_bucket_state:/state
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - storage

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  minio_data:
  minio_bucket_state:
  transcode_temp:

networks:
  public:
    ipam:
      config:
        - subnet: 172.30.42.0/24
  database:
    internal: true
  storage:
    internal: true
