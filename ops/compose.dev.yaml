name: family-learning-mvp-task2-test-20260917

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_learning_test
      POSTGRES_USER: family_learning_test
      POSTGRES_PASSWORD: family_learning_test_local_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_learning_test -d family_learning_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: family_test_access
      MINIO_ROOT_PASSWORD: family_test_secret_local
      MINIO_BUCKET: family-learning-mvp-test
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      MINIO_API_STALE_UPLOADS_EXPIRY: 168h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "/ops/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: family_test_access
      MINIO_ROOT_PASSWORD: family_test_secret_local
      MINIO_APP_SECRET_KEY: family_test_app_secret_local
      MINIO_BUCKET: family-learning-mvp-test
    volumes:
      - ./init-minio.sh:/ops/init-minio.sh:ro
      - minio_bucket_state:/state
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
    name: family-learning-mvp-task2-test-20260917-postgres-data
  minio_data:
    name: family-learning-mvp-task2-test-20260917-minio-data
  minio_bucket_state:
    name: family-learning-mvp-task2-test-20260917-minio-bucket-state
